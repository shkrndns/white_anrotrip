# Проверка: pnpm spellcheck  (или: pnpm exec cspell -c cspell.config.yaml "src/...")
$schema: https://raw.githubusercontent.com/streetsidesoftware/cspell/main/cspell.schema.json
version: '0.2'
language: ru,en
import:
  - '@cspell/cspell-bundled-dicts/cspell-default.json'
  - '@cspell/dict-ru_ru/cspell-ext.json'
ignorePaths:
  - node_modules
  - dist
  - .astro
  - pnpm-lock.yaml
  - src/pages/terms.astro
  - src/pages/privacy.astro
ignoreRegExpList:
  - /'\.\.\/assets\/team\/[^']+'/
