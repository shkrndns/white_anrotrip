name: Deploy to VPS

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy:
        description: 'Deploy to VPS after build?'
        required: true
        default: 'false'
        type: choice
        options: ['true', 'false']

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write
  attestations: write
  id-token: write

jobs:
  # ── Шаг 0: TypeScript + Astro check ─────────────────────────────────────
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup pnpm
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Astro check
        run: pnpm check

  # ── Шаг 1: Сборка и push образа в GHCR ──────────────────────────────────
  # Запускается при каждом push в main.
  # VPS не нужен — образ всегда актуален в реестре.
  build-push:
    runs-on: ubuntu-latest
    needs: check

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3d33f178e8 # v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true

  # ── Шаг 2: Деплой на VPS ─────────────────────────────────────────────────
  # Запускается ТОЛЬКО вручную через Actions → Run workflow → deploy: true.
  # Требует: SSH_HOST и SSH_PRIVATE_KEY в GitHub Secrets.
  deploy:
    runs-on: ubuntu-latest
    needs: build-push
    if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.deploy == 'true' }}

    steps:
      - name: Deploy to Beget VPS
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        with:
          host: ${{ secrets.SSH_HOST }}
          username: deploy
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            cd /home/deploy/anrotrip

            IMAGE_TAG=sha-${{ github.sha }} \
            GITHUB_REPOSITORY=${{ github.repository }} \
              docker compose pull app

            IMAGE_TAG=sha-${{ github.sha }} \
            GITHUB_REPOSITORY=${{ github.repository }} \
              docker compose up -d

            docker image prune -f
